name: Build APK

# Builds the Android APK on every push and pull request.
# Pushing a tag like `v2.0.0` also publishes a GitHub Release with the APK
# attached, so anyone can download and install it.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pinned: the old Flutter 2.10 toolchain is not tested on newer images.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Gradle 6.7 / Android Gradle Plugin 4.1 need Java 11.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '2.10.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/best-clock.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: best-clock-apk
          path: dist/best-clock.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Best Clock ${{ github.ref_name }}
          files: dist/best-clock.apk
          generate_release_notes: true
          body: |
            ## Download

            Download **best-clock.apk** below and open it on your Android phone
            (allow "Install unknown apps" for your browser or file manager if asked).

            World clock · Alarms · Stopwatch · Timer · Dark & light themes
